# CI only: lint, typecheck, tests; next build on main pushes. Deploy stays on AWS Amplify (amplify.yml).
# Pin app Node via .nvmrc (kept in sync with Amplify amplify.yml); see docs/CI-AND-DEPLOYMENT.md.
#
# Do not use paths-ignore on pull_request while `quality` is a required ruleset check —
# a skipped workflow leaves the check pending forever and blocks merge.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      # v5+ uses Node 24 for the action runtime (avoids runner deprecation of Node 20 for actions).
      - uses: actions/checkout@v7

      - name: Use Node.js (same as .nvmrc / Amplify)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - name: Audit production criticals
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Build (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build
