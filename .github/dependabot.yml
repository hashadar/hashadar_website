version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-patch:
        dependency-type: production
        update-types:
          - patch
      amplify-backend:
        patterns:
          - '@aws-amplify/*'
          - aws-amplify
          - aws-cdk
          - aws-cdk-lib
          - constructs
    ignore:
      # eslint-config-next still bundles eslint-plugin-react that crashes on ESLint 10
      # (context.getFilename removed). Revisit when Next ships ESLint 10 support.
      - dependency-name: eslint
        versions: ['>=10']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
