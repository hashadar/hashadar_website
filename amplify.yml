version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22
        # Local npm cache speeds reinstalls; keep path relative for Amplify cache.
        - npm config set cache .npm
        - npm ci
        # Skip pipeline-deploy when amplify/ and Amplify/CDK deps are unchanged.
        # Script exit 0 = redeploy; exit 1 = generate outputs only.
        - |
          if npx tsx scripts/amplify-backend-changed.ts; then
            echo "Backend changed; running pipeline-deploy"
            npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
          else
            echo "Backend unchanged; generating amplify_outputs.json only"
            npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
          fi
frontend:
  phases:
    preBuild:
      commands:
        # Pin Node 22+ for SSR (Amplify AL2023 supports 20/22/24; default on AL2023 is 22).
        # Use Amazon Linux 2023 build image in the Amplify console if you still see older Node.
        - nvm use 22
        # Reuse backend-phase install when present; otherwise install for frontend-only rebuilds.
        - npm config set cache .npm
        - |
          if [ -d node_modules ]; then
            echo "Reusing node_modules from backend phase"
          else
            npm ci
          fi
    build:
      commands:
        # Console env + Hosting secrets exist in the build env only; Next SSR
        # needs them in .env.production (see docs/wmw/snapshot-storage.md).
        - npx tsx scripts/write-amplify-ssr-env.ts
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .next/cache/**/*
